<!--
  demo: filter-drop-shadow
  Kanonisk källa för både live-demon och kodvalvet i index.html.
  Bygg: npm run build · Kontroll: npm run build:check
  Grupp B: swatch-familjen, .swatch-solo och det fyrskiktade filtermotivet är
  delade (demos/_delat/) och begärs med data-include. .f-drop är demots enda
  egen regel; labbets --lv-skala är sidans scenografi och ligger i data-live.
-->
<div class="demo-yta swatch-solo"><span class="swatch f-drop f-motiv"><span class="swatch-yta"></span><span class="swatch-lbl">drop-shadow</span></span></div>
<style data-include="swatch swatch-solo filter-motiv"></style>
<style>
.f-drop .swatch-yta { filter: drop-shadow(0 0 8px var(--acc)) brightness(.9); }
</style>
<style data-live>
/* Reglerbart filter: --lv (0–8) blir 0–16 px skuggradie. Labbet är sidans
   scenografi och kopieras inte. */
.labbar.f-drop .swatch-yta { filter: drop-shadow(0 0 calc(var(--lv) * 2px) var(--acc)) brightness(.9); }
</style>
