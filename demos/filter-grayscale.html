<!--
  demo: filter-grayscale
  Kanonisk källa för både live-demon och kodvalvet i index.html.
  Bygg: npm run build · Kontroll: npm run build:check
  Grupp B: swatch-familjen, .swatch-solo och det fyrskiktade filtermotivet är
  delade (demos/_delat/) och begärs med data-include. .f-gray är demots enda
  egen regel; labbets --lv-skala är sidans scenografi och ligger i data-live.
-->
<div class="demo-yta swatch-solo"><span class="swatch f-gray f-motiv"><span class="swatch-yta"></span><span class="swatch-lbl">grayscale</span></span></div>
<style data-include="swatch swatch-solo filter-motiv"></style>
<style>
.f-gray .swatch-yta { filter: grayscale(1); }
</style>
<style data-live>
/* Reglerbart filter: --lv (0–8) blir 0–100 % gråskala. Labbet är sidans
   scenografi och kopieras inte. */
.labbar.f-gray .swatch-yta { filter: grayscale(calc(var(--lv) * 12.5%)); }
</style>
