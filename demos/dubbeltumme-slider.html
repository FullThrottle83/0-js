<div class="demo-yta dual-slider">
  <div class="dual-track"></div>
  <input type="range" min="0" max="100" value="20" aria-label="Lägsta pris">
  <input type="range" min="0" max="100" value="75" aria-label="Högsta pris">
</div>
<style>
/* Dubbeltumme-slider */
.dual-slider { position: relative; height: 2.2rem; display: flex; align-items: center; }
.dual-slider input[type="range"] { position: absolute; width: 100%; appearance: none; background: transparent; pointer-events: none; margin: 0; }
.dual-slider input[type="range"]::-webkit-slider-thumb { appearance: none; pointer-events: auto; width: 18px; height: 18px; border-radius: 50%; background: var(--acc); cursor: grab; box-shadow: 0 0 0 3px var(--bg); }
.dual-slider input[type="range"]::-moz-range-thumb { pointer-events: auto; width: 18px; height: 18px; border: 0; border-radius: 50%; background: var(--acc); cursor: grab; box-shadow: 0 0 0 3px var(--bg); }
.dual-track { position: absolute; width: 100%; height: 4px; border-radius: 99px; background: var(--line); }
</style>
