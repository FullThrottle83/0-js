<!-- Suddigheten är bara presentation, texten finns kvar i HTML-källan. Använd aldrig mönstret för hemligheter. -->
<p class="demo-yta" style="font-size:.94rem; color:var(--dim);">Filmslutet: <span class="spoiler" tabindex="0" aria-label="Spoiler, fokusera eller hovra för att avslöja"><span>hunden överlever</span></span></p>
<style>
.spoiler {
  display: inline-block; padding: .05em .4em; border-radius: 4px; background: var(--ink); color: transparent;
  cursor: pointer; user-select: none; overflow: hidden;
}
.spoiler span { display: inline-block; filter: blur(6px); transition: filter .25s ease; }
.spoiler:hover, .spoiler:focus-visible { background: var(--acc-soft); color: var(--ink); }
.spoiler:hover span, .spoiler:focus-visible span { filter: blur(0); }
</style>
